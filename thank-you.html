<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Pinnacle Sites</title>
  <style>
    body {
      background-color: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .thank-you {
      max-width: 600px;
      padding: 24px;
    }

    h1 {
      font-size: 2.25rem;
      margin-bottom: 16px;
    }

    p {
      font-size: 1.1rem;
      color: #aaa;
      margin-bottom: 32px;
    }

    a {
      color: #fff;
      text-decoration: none;
      background: #ffffff;
      color: #0a0a0a;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      transition: background 0.3s;
    }

    a:hover {
      background: #ccc;
    }
  </style>
</head>
<body>
  <div class="thank-you">
    <h1>Inquiry Received.</h1>
    <p>I’ll review what you sent and respond within 24–48 hours.</p>
    <a href="/">Return to Homepage</a>
  </div>
</body>
</html>
